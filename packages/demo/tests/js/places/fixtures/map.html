  <section class="shell masthead">
    <p class="label label--ink">
      Where to see the work
    </p>
    <h1 class="title" style="margin-top: 0.75rem">Venues</h1>
    <div id="foehn-section-place-summary" data-foehn-section="place-summary"><div class="places-summary">
      <p class="places-summary__total">
              2 places
                </p>
    <nav class="places-view-switch" aria-label="Result view">
      <a
      class="places-view-switch__link"
      href="/venues/"
      >
      List
    </a>
      <a
      class="places-view-switch__link"
      href="/venues/?view=map"
      aria-current="page">
      Map
    </a>
  </nav>
    <p id="place-status" class="places-summary__status" role="status" aria-live="polite"></p>
</div>
</div>
  </section>

  <div class="shell places places--map">
    <aside class="places__filters">
        <div class="places-geocoder">
    <p class="places-geocoder__label" id="place-geocoder-label">
      Search near an address
    </p>
    <div
      class="places-geocoder__control"
      aria-labelledby="place-geocoder-label"
      data-component="Action MapboxGeocoder"
      data-option-access-token="pk.test"
      data-option-options="{&quot;language&quot;:&quot;en&quot;}"
      data-on:map-result="Fetch(#place-search) -> () => {
        const [lng, lat] = event.detail.result.center;
        const { near, bbox } = target.$el.elements;
        near.value = `${lat},${lng}`;
        near.disabled = false;
        if (bbox) {
          bbox.value = '';
          bbox.disabled = true;
        }
        target.$el.requestSubmit();
      }"></div>
  </div>
      <div id="foehn-section-place-filters" data-foehn-section="place-filters"><form
  id="place-search"
  class="places-filters"
  action="/venues/"
  method="get"
  role="search"
  data-component="Action Fetch"
  data-option-history
  data-option-mode="morph"
  data-option-selector="[data-foehn-section]"
  data-option-params="{&quot;foehn_sections&quot;:&quot;place-filters,place-summary,place-results,place-pagination&quot;}"
  data-loading-text="Loading places…"
  data-error-text="The places could not be loaded. The previous result is still shown."
  data-on:change.debounce300="() => $el.requestSubmit()"
  data-on:fetch-before="() => {
    const status = document.getElementById('place-status');
    if (status) status.textContent = $el.dataset.loadingText;
    $el.setAttribute('aria-busy', 'true');
  }"
  data-on:fetch-error="() => {
    const status = document.getElementById('place-status');
    if (status) status.textContent = $el.dataset.errorText;
  }"
  data-on:fetch-after="() => $el.removeAttribute('aria-busy')"
  data-on:fetch-update-after="MapboxMap(#place-map) -> () => {
    const bounds = document.querySelector('#foehn-section-place-results [data-bounds]')?.dataset.bounds;
    if (bounds) target.map.fitBounds(JSON.parse(bounds), { padding: 60, maxZoom: 12 });
  }">
  <div class="places-filters__search">
    <label for="place-search-q">Search</label>
    <input
      id="place-search-q"
      type="search"
      name="q"
      maxlength="100"
      value="">
  </div>

      <input type="hidden" name="view" value="map">
  
      <input
      type="hidden"
      name="near"
      value=""
      disabled>
      
      <input
      type="hidden"
      name="bbox"
      value=""
      disabled>
  
        <fieldset class="places-facet" data-taxonomy="place_type">
    <legend>place_type</legend>
          <label class="places-facet__option">
        <input
          type="checkbox"
          name="place_type[]"
          value="gallery"
                    >
        <span class="places-facet__name">Gallery</span>
                  <span class="places-facet__count">1</span>
              </label>
          <label class="places-facet__option">
        <input
          type="checkbox"
          name="place_type[]"
          value="bookshop"
                    >
        <span class="places-facet__name">Bookshop</span>
                  <span class="places-facet__count">1</span>
              </label>
      </fieldset>
  
  <div class="places-filters__actions">
    <button type="submit">Search</button>
      </div>
</form>
</div>
    </aside>

    <div class="places__results">
              <div class="places-map">
      <div class="places-map__locator" data-component="StoreLocator">
      <div
        id="place-map"
        class="places-map__map"
        data-component="MapboxMap Action"
        data-option-access-token="pk.test"
        data-option-center="[2.5,47]"
        data-option-zoom="5"
        data-option-map-options="{&quot;style&quot;:&quot;mapbox:\/\/styles\/mapbox\/light-v11&quot;,&quot;bounds&quot;:[[2.3522,45.764],[4.8357,48.8566]],&quot;fitBoundsOptions&quot;:{&quot;padding&quot;:60,&quot;maxZoom&quot;:12}}"
                  data-on:map-moveend="() => {
            if (event.detail.event.originalEvent) {
              document.getElementById('place-search-area').hidden = false;
            }
          }"
        >
        <div class="places-map__items" data-component="MapboxCluster">
                      <div id="foehn-section-place-results" data-foehn-section="place-results"><div
  class="places-results places-results--map"
  data-bounds="[[2.3522,45.764],[4.8357,48.8566]]">
              <ul class="places-map-items">
                        <li
          id="place-1"
          class="places-map-items__item"
          data-component="MapboxClusterItem"
          data-option-id="1"
          data-option-lng-lat="[2.3522,48.8566]">
          <article class="places-item">
  <h3 class="places-item__title">
    <a href="/venues/paris/">Paris</a>
  </h3>
          <address class="places-item__address">
              Paris          </address>
    </article>
          <template data-ref="popup">
            <div class="places-popup">
  <p class="places-popup__title">
    <a href="/venues/paris/">Paris</a>
  </p>
        <p class="places-popup__address">Paris</p>
  </div>
          </template>
        </li>
                              <li
          id="place-2"
          class="places-map-items__item"
          data-component="MapboxClusterItem"
          data-option-id="2"
          data-option-lng-lat="[4.8357,45.764]">
          <article class="places-item">
  <h3 class="places-item__title">
    <a href="/venues/lyon/">Lyon</a>
  </h3>
          <address class="places-item__address">
              Lyon          </address>
    </article>
          <template data-ref="popup">
            <div class="places-popup">
  <p class="places-popup__title">
    <a href="/venues/lyon/">Lyon</a>
  </p>
        <p class="places-popup__address">Lyon</p>
  </div>
          </template>
        </li>
            </ul>
      </div>
</div>
                  </div>
        <div class="places-map__canvas" data-ref="container"></div>
        <div data-component="MapboxNavigationControl"></div>
                  <button
            id="place-search-area"
            class="places-map__search-area"
            type="button"
            form="place-search"
            hidden
            data-component="Action"
            data-on:click="MapboxMap(#place-map) -> () => {
              const { form } = action.$el;
              const { near, radius, bbox } = form.elements;
              const bounds = target.map.getBounds();
              bbox.value = [
                bounds.getWest(),
                bounds.getSouth(),
                bounds.getEast(),
                bounds.getNorth()
              ].join(',');
              bbox.disabled = false;
              if (near) {
                near.value = '';
                near.disabled = true;
              }
              if (radius) radius.disabled = true;
              action.$el.hidden = true;
              form.requestSubmit();
            }">
            Search this area
          </button>
              </div>
    </div>
  </div>
      
      <div id="foehn-section-place-pagination" data-foehn-section="place-pagination"></div>
    </div>
  </div>
