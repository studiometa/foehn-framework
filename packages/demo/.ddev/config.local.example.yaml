# Copy this file to config.local.yaml when working on the monorepo itself.
# Run `ddev start` once before enabling it so Composer installs every dependency.
# Each later `ddev restart` mirrors the local framework packages and clears discovery.
hooks:
  post-start:
    - exec-host: |
        set -e
        cd "$DDEV_APPROOT"
        for pkg in foehn:foehn foehn-installer:installer; do
          name="${pkg%%:*}"
          src="${pkg##*:}"
          rsync -a --delete --exclude vendor/ --exclude node_modules/ \
            "../${src}/" "vendor/studiometa/${name}/"
        done
        rm -rf web/wp-content/cache/foehn/discovery
        mkdir -p web/wp-content/foehn
        {
          printf '/**\n * Block editor registrar — auto-generated by foehn-installer.\n'
          printf ' * DO NOT EDIT — this file is regenerated on `composer install`.\n */\n\n'
          cat vendor/studiometa/foehn/resources/js/editor.js
        } > web/wp-content/foehn/editor.js
