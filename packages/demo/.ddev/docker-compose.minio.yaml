# MinIO, so the demo offloads its uploads to object storage the way a deployed
# site does.
#
# Uploads are the one directory a generated web root does not make disposable, and
# `humanmade/s3-uploads` is how a Føhn site puts them somewhere a container restart
# cannot take with it. Testing that against a real bucket would mean credentials in
# CI and a bill; MinIO speaks the same API in a container next to WordPress.
#
# Two URLs, and the difference between them is the whole configuration:
#
# PHP talks to it at http://minio:9000, on the project network. Nothing else needs
# to reach it: uploads are served from the site's own domain, proxied to the bucket
# by .ddev/nginx/uploads-proxy.conf, so no port of this service is published and no
# bucket hostname appears in any URL.
services:
  minio:
    container_name: ddev-${DDEV_SITENAME}-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    command: server /data --address ":9000"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      - MINIO_ROOT_USER=foehn
      - MINIO_ROOT_PASSWORD=foehn-demo-secret
      # The demo's credentials are in the repository on purpose: this bucket exists
      # inside one ddev project and holds nothing but the demo's own test image.
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio:
