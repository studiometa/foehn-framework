# Serve cached image transforms without booting WordPress.
#
# `GlideTransformer` builds signed URLs like
#
#     /_image/2016/06/photo.jpg?w=600&h=800&fit=crop&fm=webp&s=<sig>
#
# and the first request for one is answered by PHP, which transforms the original
# and writes the result. Every request after that should never reach PHP at all:
# booting WordPress costs more than the transform saves, and an image URL is the
# most-requested kind of URL a site has.
#
# That works because Føhn keys the cache on the URL's own signature, which is a
# keyed hash of exactly the path and the parameters. So the object is at
# `cache/glide/<path>/<sig>`, and nginx can assemble that out of the request:
# `$1` from the path, `$arg_s` from the query string. Glide's own key is an xxh3
# hash, which nginx cannot compute — a rule pointed at it would miss every time
# and boot WordPress anyway, while the pages looked perfectly correct.
#
# A forged signature reaches no file: nothing is ever written under a signature
# this site did not produce. It misses, falls through to PHP, and is refused with
# a 403 there.
#
# `^~` and not a regex location. ddev's nginx-site.conf carries the usual
# `\.(jpg|png|webp)$` static-file rule, and a regex location included after it
# would lose — every transform would 404 as a missing file. `^~` outranks every
# regex whatever the order.
#
# In production this is a CDN origin rule rather than a file. Same shape.
location ^~ /_image/ {
    # The query string is kept, and this is not an oversight. The trailing `?`
    # that would drop it — MinIO has no use for `w` and `h` — drops it for the
    # miss path too, and then PHP is handed a request with no signature on it and
    # refuses its own URL with a 403. The parameters ride along to MinIO, which
    # ignores query arguments that name no S3 subresource.
    rewrite ^/_image/(.+)$ /media/cache/glide/$1/$arg_s break;

    proxy_pass http://minio:9000;
    proxy_set_header Host minio:9000;
    proxy_http_version 1.1;

    # Anonymous GETs, as for the uploads themselves — see uploads-proxy.conf.
    proxy_set_header Authorization "";
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-meta-server-side-encryption;

    # A cache hit is the whole point of this file, so it says so out loud. The
    # smoke test asserts it: without it, "did this reach PHP?" is a question you
    # can only answer by reading logs, and a rule that silently never matches is
    # the failure this design already had once.
    add_header X-Foehn-Image-Cache HIT always;

    # A transform that has not been built yet is not an error, it is a miss.
    proxy_intercept_errors on;
    error_page 403 404 = @foehn_image_miss;

    expires 30d;
}

# PHP builds it, once. The original request URI is what WordPress parses, so the
# rewrite rule behind `/_image/` still matches.
location @foehn_image_miss {
    rewrite ^ /index.php last;
}
