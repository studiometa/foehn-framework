# Serve cached image transforms without booting WordPress, and throttle the
# stream so a walk of the parameter space cannot be a fast one.
#
# `GlideTransformer` builds URLs like
#
#     /_image/2016/06/photo.jpg?w=600&h=400&fit=crop&fm=webp
#
# and the first request for one is answered by PHP, which transforms the original
# and writes the result. Every request after that should never reach PHP at all:
# booting WordPress costs more than the transform saves, and an image URL is the
# most-requested kind of URL a site has.
#
# That works because Føhn spells the transform into the cache path rather than
# hashing it. The object is at `cache/glide/<path>/<w>x<h>-<fit>-<fm>`, which nginx
# can assemble out of the request. Glide's own key is an xxh3 hash, which nginx
# cannot compute — a rule pointed at that would miss every time and boot WordPress
# anyway, while the pages looked perfectly correct.
#
# Named arguments and not `$args`, so the same transform written in another order
# finds the same file instead of building a second copy of it.
#
# `^~` and not a regex location. ddev's nginx-site.conf carries the usual
# `\.(jpg|png|webp)$` static-file rule, and a regex location included after it
# would lose — every transform would 404 as a missing file. `^~` outranks every
# regex whatever the order.
#
# In production this is a CDN origin rule rather than a file. Same shape.
location ^~ /_image/ {
    # Low sustained rate, very large burst — and that shape is the whole trick.
    #
    # It would be better to throttle only cache misses, since a hit costs nginx a
    # couple of milliseconds while a miss costs PHP fifty to two hundred. That is
    # not expressible: `limit_req` runs in the preaccess phase, and a request that
    # reaches the miss handler by internal redirect — whether `@named` or a URI —
    # never has that phase applied again. Measured here, the same limit allowed
    # 15 of 15 on the miss location, and allowed 3 of 15 on this one.
    #
    # So the limit covers hits too, and the burst is what makes that harmless.
    # Real traffic is bursty and short: a gallery asks for thirty images at once
    # and then stops. A walk is sustained. burst=100 absorbs any page this site
    # has, while 5r/s sits well under the ~18 transforms per second eight FPM
    # workers can actually produce.
    limit_req zone=foehn_image burst=100 nodelay;

    # The query string is kept: it belongs to the miss path, which needs the
    # parameters to know what to build. MinIO ignores arguments that name no S3
    # subresource.
    rewrite ^/_image/(.+)$ /media/cache/glide/$1/${arg_w}x${arg_h}-${arg_fit}-${arg_fm} break;

    proxy_pass http://minio:9000;
    proxy_set_header Host minio:9000;
    proxy_http_version 1.1;

    # Anonymous GETs, as for the uploads themselves — see uploads-proxy.conf.
    proxy_set_header Authorization "";
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-meta-server-side-encryption;

    # A cache hit is the whole point of this file, so it says so out loud. The
    # smoke test asserts it: without it, "did this reach PHP?" is a question you
    # can only answer by reading logs, and a rule that silently never matches is
    # the failure this design already had once.
    add_header X-Foehn-Image-Cache HIT always;

    # A transform that has not been built yet is not an error, it is a miss.
    proxy_intercept_errors on;
    error_page 403 404 = @foehn_image_miss;

    expires 30d;
}

# PHP builds it, once. The original request URI is what WordPress parses, so the
# rewrite rule behind `/_image/` still matches — and `$args` survives a named
# location, which a URI redirect would have dropped.
location @foehn_image_miss {
    rewrite ^ /index.php last;
}
