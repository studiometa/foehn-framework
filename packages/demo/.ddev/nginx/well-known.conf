# ddev's own site configuration denies every path that starts with a dot, and with it
# /.well-known/. The installer copies public/.well-known/ into web/ to be served, and
# the runtime image serves it, so ddev does too. A prefix location with `^~` wins over
# the regular expression that denies dotfiles.
location ^~ /.well-known/ {
    try_files $uri =404;
}
