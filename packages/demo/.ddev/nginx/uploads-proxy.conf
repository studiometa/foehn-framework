# Serve uploads from the site's own domain, and fetch them from the bucket.
#
# `humanmade/s3-uploads` writes to object storage either way. What this changes is
# the URL: with S3_UPLOADS_DISABLE_REPLACE_UPLOAD_URL set, WordPress keeps emitting
# /wp-content/uploads/… and something in front has to map that to the bucket. The
# plugin's README names this setup — "nginx proxy to s3" — and it is the reason the
# constant exists.
#
# The alternative is to point S3_UPLOADS_BUCKET_URL at the bucket and let the URLs
# carry its hostname. That works, and it means every image on the site depends on a
# second origin being reachable and correctly named. Here it meant a port number in
# the URL, so a renamed ddev project served pages with every image broken and
# nothing in wp-admin to explain it.
#
# In production the same job is done by a CDN origin rule rather than by this file.
location ^~ /wp-content/uploads/ {
    # MinIO is on the project network only. The bucket is `media`, and the plugin
    # stores below `uploads/`, so the prefix maps one to one.
    proxy_pass http://minio:9000/media/uploads/;

    proxy_set_header Host minio:9000;
    proxy_http_version 1.1;

    # Anonymous GETs, so no credentials travel and none are needed — the bucket
    # policy allows public reads. See tests/smoke/provision-bucket.php.
    proxy_set_header Authorization "";
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-meta-server-side-encryption;

    proxy_intercept_errors on;
    error_page 403 404 = @uploads_missing;

    # `expires` writes Cache-Control on its own; adding one as well emits the
    # header twice.
    expires 30d;
}

location @uploads_missing {
    return 404;
}
