# The shared state behind the rate limit in ../nginx/image-cache.conf.
#
# It lives here and not beside the rule it serves because `limit_req_zone` is an
# `http` directive: ddev mounts .ddev/nginx/ inside the `server` block, and this
# directory into sites-enabled, which nginx includes at `http` level.
#
# The `00-` prefix is load-bearing. nginx includes sites-enabled/*.conf in glob
# order and a zone has to be declared before the `limit_req` that names it, so
# this file has to sort ahead of nginx-site.conf. Renamed without the prefix,
# nginx refuses to start with "unknown limit_req zone".
#
# 5r/s is the sustained rate; the burst that goes with it is large, and that
# pairing is deliberate. See ../nginx/image-cache.conf for why the limit has to
# cover cache hits as well as misses, and why a big burst makes that harmless.
limit_req_zone $binary_remote_addr zone=foehn_image:10m rate=5r/s;
