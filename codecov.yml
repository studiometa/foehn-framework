# No codecov.yml existed before this file: the project/patch checks that everything
# else runs against were whatever codecov.io has configured for `target: auto`
# (compare against the pull's base, no fixed number) — this file reproduces that
# default explicitly rather than replacing it with a guessed number, because
# defining `coverage.status` here overrides whatever the dashboard has stored.
#
# Why this exists (studiometa/foehn-framework#134):
#
# `packages/foehn/src/PageCache/**`, the four `cache:*` console commands, the
# PageCache config class, and `WebRootGenerator` (which writes the drop-in and the
# mu-plugins loader) all have unit tests for their own logic. What those tests
# cannot prove is that the logic behaves correctly when it actually runs: the
# drop-in loaded by WordPress before boot (`Server::boot()`), the commands executed
# through real WP-CLI, the Warmer's HTTP calls, and the generated nginx snippet
# being read by a real nginx. Only `composer test:smoke` — an HTTP-driven suite
# against a live WordPress inside ddev (packages/starter/tests/smoke/) — exercises
# those paths, and the CI job that runs it, "Integration - Starter in WordPress",
# uploads no coverage. Doing that honestly needs a coverage driver running inside
# the ddev web container, a way to collect coverage per HTTP request
# (advanced-cache.php runs before WordPress, so the collection window has to open
# before it), and a merge step feeding a second codecov-action upload. Investigated
# for #134 and set aside — reliably standing that up in CI, rather than a spike, is
# more than a day of work on its own.
#
# Until it lands, this is the issue's fallback: a lower, honest patch target for
# exactly this surface, and — unlike a bare `component_management` entry, which is
# additive and leaves the default patch check running against every file including
# these — the default check itself now excludes them, so it no longer double-counts
# the gap this second status already accounts for. #124, almost entirely PageCache
# work, merged at 80.77% patch coverage against that day's repo-wide target
# (87.34%); every uncovered line in it was exercised by the smoke suite, not
# untested. 70% keeps this status from waving through a PR that adds a real gap in
# the part unit tests can reach, without failing the check on the part only an
# HTTP-driven WordPress can prove.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 0%
        paths:
          - "!packages/foehn/src/PageCache/**"
          - "!packages/foehn/src/Config/PageCacheConfig.php"
          - "!packages/foehn/src/Console/Commands/PageCacheClearCommand.php"
          - "!packages/foehn/src/Console/Commands/PageCacheConfigCommand.php"
          - "!packages/foehn/src/Console/Commands/PageCacheStatusCommand.php"
          - "!packages/foehn/src/Console/Commands/PageCacheWarmCommand.php"
          - "!packages/installer/src/WebRootGenerator.php"
      pagecache:
        target: 70%
        paths:
          - packages/foehn/src/PageCache/**
          - packages/foehn/src/Config/PageCacheConfig.php
          - packages/foehn/src/Console/Commands/PageCacheClearCommand.php
          - packages/foehn/src/Console/Commands/PageCacheConfigCommand.php
          - packages/foehn/src/Console/Commands/PageCacheStatusCommand.php
          - packages/foehn/src/Console/Commands/PageCacheWarmCommand.php
          - packages/installer/src/WebRootGenerator.php
