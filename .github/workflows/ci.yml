name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Mago lint
        run: composer lint

  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Mago analyse
        run: composer analyse

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests with coverage
        run: composer test:coverage

      # The framework suite is the one measured for coverage; the starter's own
      # suite covers the example theme and has to stay green too.
      - name: Run the starter test suite
        run: composer test:starter

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/clover.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-foehn

  editor-script:
    name: Editor Script - Syntax & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The generic block editor registrar is copied verbatim into every project's
      # web root by the installer, so a mistake in it would take out the block editor
      # of every install with no other signal. Both steps run on the Node built-ins
      # only, so no install step is needed.
      - name: Check editor registrar syntax
        run: npm run lint:editor

      - name: Test editor registrar
        run: npm run test:editor

  vite-plugin-lint:
    name: Vite Plugin - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run -w @studiometa/foehn-vite-plugin lint

      - name: Run oxfmt check
        run: npm run -w @studiometa/foehn-vite-plugin fmt:check

      - name: Run typecheck
        run: npm run -w @studiometa/foehn-vite-plugin typecheck

  vite-plugin-test:
    name: Vite Plugin - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run -w @studiometa/foehn-vite-plugin test

  vite-plugin-build:
    name: Vite Plugin - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run -w @studiometa/foehn-vite-plugin build

  integration:
    name: Integration - Starter in WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      # ddev mounts packages/starter alone, so Composer inside the container cannot
      # read path repositories pointing outside it. The install runs here instead,
      # and the container picks up the vendor directory that comes out of it.
      - name: Point the starter at this checkout of the packages
        working-directory: packages/starter
        run: |
          composer config repositories.foehn '{"type":"path","url":"../foehn","options":{"symlink":false}}'
          composer config repositories.foehn-installer '{"type":"path","url":"../installer","options":{"symlink":false}}'
          composer require --no-update studiometa/foehn:@dev studiometa/foehn-installer:@dev

      - name: Install starter dependencies
        working-directory: packages/starter
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction

      - name: Start ddev
        uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: packages/starter

      - name: Run the smoke test
        working-directory: packages/starter
        run: ./tests/smoke/run.sh

      # The cache is a deployment step, and a warm cache is a different code path:
      # items are restored rather than scanned. The site has to serve either way.
      - name: Generate the discovery cache and test again
        working-directory: packages/starter
        run: |
          ddev exec 'cd /var/www/html && wp foehn discovery:generate'
          ./tests/smoke/run.sh
