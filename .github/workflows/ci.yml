name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Mago lint
        run: composer lint

  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Mago analyse
        run: composer analyse

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests with coverage
        run: composer test:coverage

      # The ACF integration is its own package now, with its own suite. Measured
      # too: its lines are in the same diffs as the framework's.
      - name: Run the ACF test suite with coverage
        run: composer test:coverage:acf

      # The starter's own suite covers the theme skeleton, and the demo's covers
      # the features. Both have to stay green.
      - name: Run the starter test suite
        run: composer test:starter

      - name: Run the demo test suite
        run: composer test:demo

      # The installer writes wp-config.php and the web root into every project
      # created from the starter, so it gets its own suite.
      # Measured too: its lines are in the same diffs, and a patch that only ever
      # counted the framework's coverage reported them all as untested.
      - name: Run the installer test suite with coverage
        run: composer test:coverage:installer

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/clover.xml,./coverage/clover-acf.xml,./coverage/clover-installer.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-foehn

  editor-script:
    name: Editor Script - Syntax & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The generic block editor registrar is copied verbatim into every project's
      # web root by the installer, so a mistake in it would take out the block editor
      # of every install with no other signal. Both steps run on the Node built-ins
      # only, so no install step is needed.
      - name: Check editor registrar syntax
        run: npm run lint:editor

      - name: Test editor registrar
        run: npm run test:editor

  vite-plugin-lint:
    name: Vite Plugin - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run -w @studiometa/foehn-vite-plugin lint

      - name: Run oxfmt check
        run: npm run -w @studiometa/foehn-vite-plugin fmt:check

      - name: Run typecheck
        run: npm run -w @studiometa/foehn-vite-plugin typecheck

  vite-plugin-test:
    name: Vite Plugin - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run -w @studiometa/foehn-vite-plugin test

  vite-plugin-build:
    name: Vite Plugin - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run -w @studiometa/foehn-vite-plugin build

  demo-scripts:
    name: Demo - Browser Tests
    runs-on: ubuntu-latest
    # The browser install is the only step here that reaches the network for
    # anything substantial; without a bound, a stall on it hangs the run for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Without --with-deps: that flag apt-installs Chromium's system libraries,
      # which the ubuntu-latest image already ships, and it hung for 15 minutes on
      # the first run of this job.
      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run tests
        run: npm run -w @studiometa/foehn-demo test:run

  integration-demo:
    name: Integration - Demo in WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      # ddev mounts packages/demo alone, so Composer inside the container cannot
      # read path repositories pointing outside it. The install runs here instead,
      # and the container picks up the vendor directory that comes out of it.
      - name: Point the demo at this checkout of the packages
        working-directory: packages/demo
        run: |
          composer config repositories.foehn '{"type":"path","url":"../foehn","options":{"symlink":false}}'
          composer config repositories.foehn-installer '{"type":"path","url":"../installer","options":{"symlink":false}}'
          composer require --no-update studiometa/foehn:@dev studiometa/foehn-installer:@dev

      - name: Install demo dependencies
        working-directory: packages/demo
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction

      - name: Start ddev
        uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: packages/demo

      - name: Run the smoke test
        working-directory: packages/demo
        run: ./tests/smoke/run.sh

      # The cache is a deployment step, and a warm cache is a different code path:
      # items are restored rather than scanned. The site has to serve either way.
      - name: Generate the discovery cache and test again
        working-directory: packages/demo
        run: |
          ddev exec 'cd /var/www/html && wp foehn discovery:generate'
          ./tests/smoke/run.sh

  # The starter has almost nothing in it, which is the point — and exactly why it
  # needs its own run. What breaks a starting point is the boot, not a feature, and
  # a project created from it has no demo theme to fall back on.
  integration-starter:
    name: Integration - Starter in WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Point the starter at this checkout of the packages
        working-directory: packages/starter
        run: |
          composer config repositories.foehn '{"type":"path","url":"../foehn","options":{"symlink":false}}'
          composer config repositories.foehn-installer '{"type":"path","url":"../installer","options":{"symlink":false}}'
          composer require --no-update studiometa/foehn:@dev studiometa/foehn-installer:@dev

      - name: Install starter dependencies
        working-directory: packages/starter
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-progress --no-interaction

      - name: Start ddev
        uses: ddev/github-action-setup-ddev@v1
        with:
          ddevDir: packages/starter

      - name: Run the smoke test
        working-directory: packages/starter
        run: ./tests/smoke/run.sh

      - name: Generate the discovery cache and test again
        working-directory: packages/starter
        run: |
          ddev exec 'cd /var/www/html && wp foehn discovery:generate'
          ./tests/smoke/run.sh

      # The page cache's end-to-end suite is Pest, and Pest lives in the monorepo's own
      # vendor directory — the steps above install the starter's only. It drives real
      # requests through nginx and through the PHP drop-in, which is the only place the
      # fast path can be shown to work: a unit test cannot prove a web server reads the
      # file PHP wrote.
      - name: Install monorepo dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run the page cache end-to-end suite
        run: composer test:smoke
