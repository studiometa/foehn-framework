name: Split Monorepo

on:
  push:
    branches:
      - main
  # A release: release.yml calls this with the tag it has just pushed. A tag pushed
  # with GITHUB_TOKEN starts no workflow, so the tag itself never triggers this.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to split"
        type: string
        required: true
    secrets:
      MONOREPO_SPLIT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  split:
    name: Split ${{ matrix.package.name }}
    runs-on: ubuntu-latest

    # One split at a time per target repository.
    #
    # The action has no tag-only mode: `branch` defaults to `main` and is required, so a
    # tag split also commits the package tree onto the mirror's `main` and pushes that
    # branch. A merge to `main` landing during a release starts a branch split of the
    # same mirror; the second push to arrive would be rejected with `! [rejected] main ->
    # main (fetch first)`, and because the action pushes the branch before the tag and
    # dies on a failed command, the tag push would never happen. That is how `0.6.1`
    # reached four mirrors and left `foehn-demo` a version behind, when the tag push and
    # the `main` push each started a run.
    #
    # Serialised, either order works: whichever run goes second finds the content already
    # there, prints "No files to change", and goes straight to pushing its tag.
    #
    # Keyed on the remote rather than on the run, because two runs pushing *different*
    # targets never collide and grouping them all would make each release wait five times
    # over. `cancel-in-progress` stays off — the run being kept may be the one carrying
    # the tag.
    concurrency:
      group: split-${{ matrix.package.remote }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: "foehn", local: "packages/foehn", remote: "foehn" }
          - { name: "acf", local: "packages/acf", remote: "foehn-acf" }
          - { name: "installer", local: "packages/installer", remote: "foehn-installer" }
          - { name: "starter", local: "packages/starter", remote: "foehn-starter" }
          - { name: "demo", local: "packages/demo", remote: "foehn-demo" }

    steps:
      # On a release, the tag: the run itself started on `main` before the release
      # commit existed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Split (tag)
        if: inputs.tag != ''
        uses: symplify/monorepo-split-github-action@f10477258c88013cc5902388ec47fe9457837041 # v2.4.4
        with:
          package_directory: ${{ matrix.package.local }}
          repository_organization: studiometa
          repository_name: ${{ matrix.package.remote }}
          tag: ${{ inputs.tag }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}

      - name: Split (branch)
        if: inputs.tag == ''
        uses: symplify/monorepo-split-github-action@f10477258c88013cc5902388ec47fe9457837041 # v2.4.4
        with:
          package_directory: ${{ matrix.package.local }}
          repository_organization: studiometa
          repository_name: ${{ matrix.package.remote }}
          branch: main
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
