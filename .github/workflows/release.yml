name: Release

on:
  push:
    tags:
      - "[0-9]+.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Every package requires ^8.5; on 8.4 composer install fails the platform
          # check, the test job never passes, and the tag produces no release at all.
          php-version: "8.5"
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      # The starter and the demo pin the framework to an exact version, so that
      # `composer create-project` installs a combination somebody has run rather
      # than whatever the range admits that day. The cost is that every release
      # has to move the pin, and a pin is easy to forget: 0.6.0 shipped a starter
      # requiring `^0.5`, which a caret on a 0.x resolves to the *previous* minor,
      # so create-project kept building 0.5.10 projects while the tag said 0.6.0.
      # `Prepare 0.5.0` bumped it by hand and `Prepare 0.6.0` did not. This is the
      # step that stops a release from depending on memory.
      - name: Check the starter and the demo require the version being tagged
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          for package in starter demo; do
            for dependency in studiometa/foehn studiometa/foehn-installer; do
              CONSTRAINT=$(php -r '
                $composer = json_decode(file_get_contents($argv[1]), true);
                echo $composer["require"][$argv[2]] ?? "";
              ' "packages/$package/composer.json" "$dependency")

              if [[ -z "$CONSTRAINT" ]]; then
                echo "::error::packages/$package does not require $dependency"
                exit 1
              fi

              php -r '
                require "vendor/autoload.php";
                exit(Composer\Semver\Semver::satisfies($argv[1], $argv[2]) ? 0 : 1);
              ' "$TAG" "$CONSTRAINT" || {
                echo "::error::packages/$package requires $dependency:$CONSTRAINT, which does not admit $TAG"
                exit 1
              }
            done
          done

  # The Vite plugin is the one package that ships through npm rather than Packagist,
  # and for its first four releases it shipped nowhere at all: split.yml mirrors the
  # PHP packages only, so `npm install` in a project created from the starter got a
  # 404 on a dependency its own vite.config.js imports.
  publish-npm:
    name: Publish the Vite plugin
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing authenticates with this OIDC token, which is why no
      # NPM_TOKEN appears below. Its other half is configured on npmjs.com: a trusted
      # publisher that names this repository and this workflow file by name, so
      # renaming this file revokes the job's ability to publish.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Node 24 ships an npm older than 11.5.1, the first release that recognises an
      # OIDC environment. On anything older the publish looks for a token instead,
      # finds none, and fails as unauthenticated.
      - name: Install an npm that speaks OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # npm takes the published version from package.json, not from the tag, so the
      # two drifting apart would put out a version nobody tagged. The release commit
      # carries the bump; this step only refuses to publish when it was forgotten.
      - name: Check the version matches the tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(node -p "require('./packages/vite-plugin/package.json').version")
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::tag $TAG does not match packages/vite-plugin/package.json version $VERSION"
            exit 1
          fi

      # ci.yml runs the plugin's own suite on branches and pull requests only. Without
      # these two steps a tag would publish a build that nothing had tested, from a
      # dist/ that does not exist - it is generated, and the `files` list is just dist.
      - name: Run tests
        run: npm run -w @studiometa/foehn-vite-plugin test

      - name: Build
        run: npm run -w @studiometa/foehn-vite-plugin build

      # The tag filter on this workflow matches 0.6.0-rc.1 as readily as 0.6.0, and a
      # prerelease published as `latest` is what every fresh install would then get.
      - name: Resolve the dist-tag
        run: |
          NPM_TAG=latest
          if [[ $GITHUB_REF_NAME =~ (alpha|beta|rc) ]]; then
            NPM_TAG=next
          fi
          echo "NPM_TAG=$NPM_TAG" >> $GITHUB_ENV

      - name: Publish
        run: npm publish -w @studiometa/foehn-vite-plugin --tag "$NPM_TAG"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          # Handle multiline output
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            **Full Changelog**: https://github.com/studiometa/foehn-framework/blob/${{ github.ref_name }}/CHANGELOG.md

            ## Installation

            ```bash
            # Core framework
            composer require studiometa/foehn:^${{ steps.version.outputs.VERSION }}

            # New project from starter
            composer create-project studiometa/foehn-starter my-project
            ```
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
