name: Release

# Each merge into main releases what its fragments describe. A manual run
# (`gh workflow run release.yml -f version=major`) forces a bump.
#
# The release job folds `.changelog/` into CHANGELOG.md, runs `npm version`
# (the root `version` script, scripts/move-pins.mjs, moves the inter-package
# pins and the demo's runtime image), commits `Release <version>`, tags, pushes
# and creates the GitHub release. A tag pushed with GITHUB_TOKEN starts no
# workflow, so the split, the runtime image and the demo deploy are called from
# this run rather than triggered by the tag.
#
# npm trusted publishing is bound to this file name: keep the publish job here,
# not in a reusable workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # Every package requires ^8.5: on 8.4 composer install fails the
          # platform check.
          php-version: "8.5"
          coverage: pcov

      # Every package carries the same version, and a package that depends on
      # another package of this repository requires that exact version: no
      # caret, no range. So `composer create-project` and `npm install` get a
      # combination somebody has run. 0.6.0 shipped a starter requiring `^0.5`,
      # which a caret on a 0.x resolves to the *previous* minor; foehn-acf kept
      # `^0.5` through 0.6.2. scripts/move-pins.mjs moves every pin that holds
      # the current version; this proves they all hold it, including any a new
      # package adds, so the bump moves all of them.
      #
      # It reads the composer.json and package.json of every package, the
      # version the root composer.json gives the framework path repository, and
      # the `version` of every package.json that has one. It refuses the release
      # when one of these, or a constraint on a studiometa/foehn* or
      # @studiometa/foehn-* package, is not the version of the root
      # package.json. The pins in $required must also exist, so that removing
      # one is not a way to pass.
      #
      # It runs here and not in the `version` script: `npm version --workspaces
      # --include-workspace-root` runs the root script before it bumps the
      # workspaces, and no script runs after them.
      - name: Check every package version and inter-package constraint
        run: |
          # The PHP is in single quotes on purpose: the shell must not expand it.
          # shellcheck disable=SC2016
          php -r '
            $current = json_decode(file_get_contents("package.json"), true, flags: JSON_THROW_ON_ERROR)["version"];
            $required = [
              "packages/acf/composer.json studiometa/foehn",
              "packages/starter/composer.json studiometa/foehn",
              "packages/starter/composer.json studiometa/foehn-installer",
              "packages/demo/composer.json studiometa/foehn",
              "packages/demo/composer.json studiometa/foehn-installer",
              "packages/starter/package.json @studiometa/foehn-vite-plugin",
              "packages/demo/package.json @studiometa/foehn-vite-plugin",
              "composer.json studiometa/foehn",
              "packages/vite-plugin/package.json version",
              "package.json version",
            ];
            $sections = ["require", "require-dev", "dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];

            $pins = [];
            foreach (["package.json", ...glob("packages/*/{composer,package}.json", GLOB_BRACE)] as $file) {
              $json = json_decode(file_get_contents($file), true, flags: JSON_THROW_ON_ERROR);
              if (isset($json["version"])) {
                $pins["$file version"] = $json["version"];
              }
              foreach ($sections as $section) {
                foreach ($json[$section] ?? [] as $name => $constraint) {
                  if (preg_match("#^@?studiometa/foehn(-|$)#", $name)) {
                    $pins["$file $name"] = $constraint;
                  }
                }
              }
            }

            // The root requires the packages with @dev from path repositories. The
            // version it gives the framework there is what the pin in foehn-acf
            // resolves against, so it moves with the others.
            $root = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR);
            foreach ($root["repositories"] as $repository) {
              foreach ($repository["options"]["versions"] ?? [] as $name => $version) {
                $pins["composer.json $name"] = $version;
              }
            }

            $failed = false;
            foreach ($required as $pin) {
              if (!isset($pins[$pin])) {
                echo "::error::$pin is missing\n";
                $failed = true;
              }
            }
            foreach ($pins as $pin => $constraint) {
              if ($constraint !== $current) {
                echo "::error::$pin is $constraint, not the exact version $current\n";
                $failed = true;
              }
            }
            exit($failed ? 1 : 0);
          '

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      # The release does not wait for ci.yml: the plugin's suite runs here too,
      # so a failure stops the release before the tag.
      - name: Test the Vite plugin
        run: |
          npm ci
          npm run -w @studiometa/foehn-vite-plugin test

  # Folds the fragments, runs `npm version` (which moves the pins),
  # commits `Release <version>`, tags, pushes and creates the GitHub release.
  # The starter and the demo get a `version` too: `npm version --workspaces`
  # writes one in every workspace.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release
        id: release
        uses: weareikko/changelog@9d93346df9858eaa29007bd8530aad8f4c5b539a # 0.1.0
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}

  # The Vite plugin is the one package that ships through npm rather than
  # Packagist. "Re-run failed jobs" on this job publishes what a failed run
  # left: npm skips a version that it already has.
  publish-npm:
    name: Publish the Vite plugin
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      # The action publishes with --ignore-scripts, and the `files` list is just
      # dist/: this step builds it, and the test job ran the checks.
      - name: Install and build
        run: |
          npm ci
          npm run -w @studiometa/foehn-vite-plugin build

      # Trusted publishing (OIDC): no npm token. A prerelease goes to `next`.
      - name: Publish @studiometa/foehn-vite-plugin
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          package: packages/vite-plugin
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}

  # Packagist reads the mirrors, so the PHP packages are published by this split.
  split:
    name: Split
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/split.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    secrets:
      MONOREPO_SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}

  docker:
    name: Runtime image
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.version }}

  # After the image: the demo builds on the `-db` image of this release.
  # A prerelease is not deployed: the demo shows the current release.
  deploy-demo:
    name: Deploy the demo
    needs: [release, docker]
    if: needs.release.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-demo.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
