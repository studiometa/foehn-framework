; PHP settings that belong to running in a container.
;
; PHP does not populate `$_ENV` by default (`variables_order = "GPCS"`).
; `vlucas/phpdotenv` — which Føhn's `wp-config.php` uses — and several plugins
; read `$_ENV` first. Adding "E" makes the container's environment (Fly secrets,
; a Compose `env_file`) visible everywhere, with no `.env` written into the image.
variables_order = "EGPCS"

; `humanmade/s3-uploads` registers an `s3://` stream wrapper, so PHP has to be
; able to open remote URLs.
allow_url_fopen = On
