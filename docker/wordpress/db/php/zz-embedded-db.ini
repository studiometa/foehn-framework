; Where "localhost" is, on the `-db` image.
;
; The MariaDB client library compiled into this image already looks in
; /run/mysqld/mysqld.sock, so `mariadb -h localhost` and every `wp db` command
; find the database with nothing configured. PHP does not: its
; `mysqli.default_socket` is empty, and an empty value means the build-time
; default — /tmp/mysql.sock, where nothing has ever listened here. So WordPress
; asks for "localhost", PHP looks in the wrong place, and the site reports
; "No such file or directory" as a database error.
;
; Pointing PHP at the same socket is what lets `DB_HOST=localhost` mean the same
; thing to every part of the stack. The alternative — spelling the path into
; DB_HOST as `localhost:/run/mysqld/mysqld.sock`, which is the form
; `wpdb::parse_db_host()` understands — works for WordPress itself but not for
; `wp config create`, which does its own connection check and does not parse it.
;
; `zz-` so it is read after the base image's `zz-container.ini`; PHP takes the
; last value of a directive.

mysqli.default_socket = /run/mysqld/mysqld.sock
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
