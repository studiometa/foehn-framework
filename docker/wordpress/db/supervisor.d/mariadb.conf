; The database, started before anything that wants to read from it.
;
; Priority 10, against nginx and php-fpm at 20 and cron at 25. supervisord's
; priority orders starts, it does not wait for readiness — but nothing here
; needs it to. PHP opens its connection on the first request, and by then the
; server the entrypoint already had running has been handed over.
;
; `autorestart`, because a database that died should come back. On a site whose
; whole point is one machine, there is no second copy to fail over to.

[group:mariadb]
programs=mariadbd
priority=10

[program:mariadbd]
command = /opt/docker/bin/service.d/mariadb.sh
process_name=%(program_name)s
startsecs = 0
autostart = true
autorestart = true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
