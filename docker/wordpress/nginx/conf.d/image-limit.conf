# The shared state behind the rate limit on `/_image/`.
#
# An `http` directive, so it cannot sit beside the rule that uses it — see
# `templates/image-cache.conf.template` for why the limit has to cover cache hits
# as well as misses, and why a large burst makes that harmless.
#
# 5r/s sustained sits well under what a handful of FPM workers can produce, and
# the burst absorbs any single page.
limit_req_zone $binary_remote_addr zone=foehn_image:10m rate=5r/s;
