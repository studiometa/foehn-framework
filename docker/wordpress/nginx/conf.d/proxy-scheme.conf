# What the container can know about a client that came through a proxy.
#
# These images run behind a TLS terminator — Fly, a load balancer, Cloudflare.
# NGINX then listens in the clear on :80, and everything about the client
# survives only in headers. Two things are wrong by default, and neither shows in
# a status code.

# ──────────────────────────────────────────────
# Scheme
# ──────────────────────────────────────────────
#
# NGINX's `$https` is `on` only when *NGINX* terminated TLS. Behind a proxy, it
# never did. `fastcgi_params` passes `HTTPS $https if_not_empty`, so PHP is told
# nothing, WordPress's `is_ssl()` returns false, and `set_url_scheme()` rewrites
# every asset URL to `http://`. A browser on an `https://` page blocks all of
# them as mixed content: the page renders with no stylesheet and no script, with
# 200s everywhere and every asset fetchable by hand.
#
# `default $https` keeps the direct case honest — with nothing in front, NGINX's
# own answer is still the right one.
map $http_x_forwarded_proto $fcgi_https {
    default $https;
    https   on;
    http    "";
}

# ──────────────────────────────────────────────
# Client address
# ──────────────────────────────────────────────
#
# Without this, `$remote_addr` is the proxy's address — the same for everybody.
# That is not only a misleading log: a `limit_req` zone keyed on
# `$binary_remote_addr` becomes one bucket shared by every visitor, which is a
# site-wide ceiling rather than a per-client limit. WordPress sees one address
# for comments, logins and every security plugin.
#
# `X-Forwarded-For` rather than a host-specific header, because every proxy sets
# it. `real_ip_recursive` walks the chain to the first hop outside the trusted
# networks.
#
# Trust is given to private address space and not to the world: the container is
# reachable only through the platform's proxy, which sits there.
# `X-Forwarded-For` is a header the client writes, and trusting it unbounded lets
# anyone choose their own address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fd00::/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
