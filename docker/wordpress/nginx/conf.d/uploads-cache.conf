# The cache behind the media proxy.
#
# An `http` directive, so it cannot sit beside the `location` that names it.
#
# On the container's ephemeral filesystem, never a volume: in WordPress a media
# file is immutable — re-uploading gives it a new name — so the cache can be
# aggressive, and losing it on deploy costs one slow request per file.
proxy_cache_path /var/cache/nginx/uploads
    levels=1:2
    keys_zone=uploads_cache:16m
    inactive=7d
    max_size=1g;
