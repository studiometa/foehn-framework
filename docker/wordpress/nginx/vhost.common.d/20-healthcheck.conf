# The health endpoint, answered by PHP so that a dead PHP-FPM fails the check.
#
# `= /healthcheck` is an exact match, which NGINX resolves before every prefix
# and regex location: nothing a project adds can shadow it.
location = /healthcheck {
    access_log off;

    fastcgi_pass php;
    fastcgi_param SCRIPT_FILENAME /opt/healthcheck.php;
    include fastcgi_params;
}
